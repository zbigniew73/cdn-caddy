<body>

<div id="login-screen">
  <div class="login-box">
    <h1>CDN Caddy Dashboard <span id="app-version-login"></span></h1>
    <input type="text" id="username-input" placeholder="login" autocomplete="username" autofocus>
    <div style="height:8px;"></div>
    <input type="password" id="password-input" placeholder="haslo" autocomplete="current-password">
    <div class="error-msg" id="login-error"></div>
    <button id="login-btn" style="width:100%;margin-top:10px;">Zaloguj</button>
  </div>
</div>

<div id="app">
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <svg width="26" height="26" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="ccIconGrad" x1="0" y1="0" x2="32" y2="32"><stop offset="0" stop-color="#12a594"/><stop offset="1" stop-color="#155e75"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#ccIconGrad)"/>
      </svg>
      <h1>CDN Caddy Dashboard <span id="app-version-header"></span></h1>
      <button class="badge unknown" id="version-badge" style="border:none;" title="Sprawdzanie wersji..."></button>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span id="current-user" style="font-size:12px;color:var(--muted);font-family:var(--mono);"></span>
      <button class="secondary" id="theme-toggle">Motyw</button>
      <button class="secondary" id="logout-btn">Wyloguj</button>
    </div>
  </header>
  <main>
    <nav>
      <div class="nav-section-label">Glowne</div>
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="services">Uslugi</button>
      <button class="tab" data-tab="gcore">Gcore DNS</button>
    </nav>
    <div class="content" id="content"></div>
  </main>
  <footer class="app-footer">
    <span id="footer-clock"></span>
  </footer>
</div>

<script src="app.js?v=0.3.0"></script>
</body>
</html>
